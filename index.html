<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tabel Scor Whist Românesc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14532d">
    <style>
        body {
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
        }
    </style>
</head>
<body class="bg-emerald-950 text-emerald-50 min-h-screen flex flex-col justify-between p-4 selection:bg-emerald-600">

    <!-- Header clasic pe verde -->
    <header class="text-center py-3 border-b border-emerald-800 mb-4 bg-emerald-900/60 rounded-2xl shadow-md backdrop-blur">
        <h1 class="text-xl font-bold tracking-wide flex items-center justify-center gap-2 text-emerald-200">
            <span>🃏</span> Tabel Scor Whist
        </h1>
        <p class="text-xs text-emerald-400">Ediție Românească • Licitări & Palme</p>
    </header>

    <main class="max-w-md w-full mx-auto flex-1 space-y-4">
        
        <!-- Ecran de configurare jucători și mod joc -->
        <div id="setupSection" class="bg-emerald-900/80 border border-emerald-700/60 p-4 rounded-2xl shadow-xl space-y-4 backdrop-blur">
            <div>
                <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-300 mb-2">Jucători Activi</h2>
                <div class="flex gap-2">
                    <input id="playerNameInput" type="text" placeholder="Nume jucător..." class="flex-1 px-3 py-2 text-sm bg-emerald-950 border border-emerald-700 rounded-xl text-emerald-100 placeholder-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                    <button onclick="addPlayer()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition shadow">Adaugă</button>
                </div>
                <div id="playersList" class="flex flex-wrap gap-2 pt-3"></div>
            </div>

            <div class="space-y-2 pt-2 border-t border-emerald-800">
                <label class="text-xs font-bold uppercase tracking-wider text-emerald-300">Structură Joc:</label>
                <select id="gameTypeSelect" class="w-full px-3 py-2 text-xs bg-emerald-950 border border-emerald-700 rounded-xl text-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="1-8-1">1 - 8 - 1 (Crescător, Maxim, Descrescător)</option>
                    <option value="8-1-8">8 - 1 - 8 (Descrescător, Minim, Crescător)</option>
                </select>
            </div>

            <button onclick="startMatch()" class="w-full mt-2 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition shadow-lg">
                Începe Meciul 🚀
            </button>
        </div>

        <!-- Ecranul principal de joc / tabel -->
        <div id="gameSection" class="hidden space-y-4">
            <div class="bg-emerald-900/80 border border-emerald-700/60 p-4 rounded-2xl shadow-xl space-y-3 backdrop-blur">
                <div class="flex justify-between items-center border-b border-emerald-800 pb-2">
                    <div>
                        <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-200">Tabel de Scor</h2>
                        <p id="currentRoundInfo" class="text-xs text-emerald-400 font-semibold"></p>
                    </div>
                    <button onclick="resetMatch()" class="text-[10px] bg-rose-900/50 hover:bg-rose-900 text-rose-200 px-2.5 py-1 rounded-lg border border-rose-700/50 transition">Resetează Meciul</button>
                </div>

                <div id="scoreboardContainer" class="overflow-x-auto">
                    <!-- Tabelul dinamic de scor -->
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-[10px] text-emerald-500 border-t border-emerald-900 mt-4">
        Whist App • PWA Activat • Salvat Local
    </footer>

    <script>
        let players = JSON.parse(localStorage.getItem('whist_players')) || [];
        let gameConfig = localStorage.getItem('whist_config') || '1-8-1';
        let matchStarted = localStorage.getItem('whist_started') === 'true';

        function renderSetup() {
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            if(players.length === 0) {
                list.innerHTML = `<span class="text-xs text-emerald-600 italic">Niciun jucător adăugat.</span>`;
                return;
            }
            players.forEach((p, index) => {
                const tag = document.createElement('div');
                tag.className = "flex items-center gap-1.5 px-3 py-1.5 bg-emerald-950 border border-emerald-700 rounded-xl text-xs text-emerald-200 shadow-sm";
                tag.innerHTML = `<span>${p}</span> <button onclick="removePlayer(${index})" class="text-rose-400 hover:text-rose-300 font-bold ml-1">×</button>`;
                list.appendChild(tag);
            });
        }

        window.addPlayer = function() {
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if(name && !players.includes(name)) {
                players.push(name);
                input.value = '';
                localStorage.setItem('whist_players', JSON.stringify(players));
                renderSetup();
            }
        }

        window.removePlayer = function(index) {
            players.splice(index, 1);
            localStorage.setItem('whist_players', JSON.stringify(players));
            renderSetup();
        }

        window.startMatch = function() {
            if(players.length < 3) {
                alert("Ai nevoie de cel puțin 3 jucători pentru a juca Whist!");
                return;
            }
            gameConfig = document.getElementById('gameTypeSelect').value;
            localStorage.setItem('whist_config', gameConfig);
            localStorage.setItem('whist_started', 'true');
            
            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            initGameData();
        }

        function initGameData() {
            document.getElementById('currentRoundInfo').textContent = `Mod selectat: ${gameConfig}`;
            const container = document.getElementById('scoreboardContainer');
            
            let html = `<table class="w-full text-left text-xs text-emerald-100"><thead><tr class="border-b border-emerald-700 text-emerald-400"><th class="py-2">Jucător</th><th class="py-2 text-right">Puncte Totale</th></tr></thead><tbody>`;
            players.forEach(p => {
                html += `<tr class="border-b border-emerald-800/60"><td class="py-2.5 font-semibold">${p}</td><td class="py-2.5 text-right font-mono text-emerald-300 font-bold">0</td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        window.resetMatch = function() {
            if(confirm("Sigur vrei să resetezi meciul? Se vor șterge toți jucătorii și scorurile.")) {
                localStorage.clear();
                players = [];
                document.getElementById('gameSection').classList.add('hidden');
                document.getElementById('setupSection').classList.remove('hidden');
                renderSetup();
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }

        renderSetup();
        if(matchStarted && players.length >= 3) {
            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            document.getElementById('gameTypeSelect').value = gameConfig;
            initGameData();
        }
    </script>
</body>
</html>
